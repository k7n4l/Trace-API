<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceAPI Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">TraceAPI</a>
        <span class="navbar-text text-white"> API Reliability Dashboard </span>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="mb-2">Dashboard</h1>
      <p class="text-secondary mb-4">Monitor your registered API endpoints.</p>

      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h2 class="h5 mb-0">Registered Endpoints</h2>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Name</th>
                  <th>Path</th>
                  <th>Method</th>
                </tr>
              </thead>

              <tbody>
                {% for endpoint in endpoints %}
                <tr>
                  <td>{{ endpoint.name }}</td>
                  <td>
                    <code>{{ endpoint.path }}</code>
                  </td>
                  <td>
                    <span class="badge text-bg-primary">
                      {{ endpoint.method }}
                    </span>
                  </td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="3" class="text-center text-secondary">
                    No endpoints registered yet.
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
